services:
  - type: web
    name: ff-arena-tournaments
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ff-arena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PGSSL
        value: "true"
databases:
  - name: ff-arena-db
    databaseName: ff_arena
    user: ff_arena_user
    plan: free
    region: singapore
